<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .login-header {
            background: #0d6efd;
            color: white;
            padding: 28px 24px;
            text-align: center;
        }

        .login-header i {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .login-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .login-body {
            padding: 28px;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px 12px;
        }

        .input-group-text {
            border-radius: 10px 0 0 10px;
            background: #f8f9fa;
        }

        .btn-login {
            border-radius: 10px;
            padding: 11px;
            font-weight: 600;
        }

        .auth-link {
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="login-header">
        <i class="fa-solid fa-hospital-user"></i>
        <h3>Đăng nhập hệ thống</h3>
        <p class="mb-0">Cổng thông tin bệnh viện</p>
    </div>

    <div class="login-body">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
            Sai email hoặc mật khẩu
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}">
            Đăng ký thành công
        </div>

        <form th:action="@{/auth/login}" method="post">

            <div class="mb-3">
                <label class="form-label">Email</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-envelope"></i>
                    </span>

                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Nhập email"
                           required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                    </span>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Nhập mật khẩu"
                           required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login">
                <i class="fa-solid fa-right-to-bracket me-1"></i>
                Đăng nhập
            </button>
        </form>

        <div class="text-center mt-3">
            <span>Chưa có tài khoản?</span>
            <a th:href="@{/auth/register}" class="auth-link">Đăng ký ngay</a>
        </div>

    </div>
</div>

</body>
</html>
