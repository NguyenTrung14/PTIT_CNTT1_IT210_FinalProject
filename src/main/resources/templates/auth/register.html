<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #198754, #0dcaf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 24px;
        }

        .register-card {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .register-header {
            background: #198754;
            color: white;
            padding: 26px 24px;
            text-align: center;
        }

        .register-header i {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .register-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .register-body {
            padding: 28px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 12px;
        }

        .btn-register {
            border-radius: 10px;
            padding: 11px;
            font-weight: 600;
        }

        .auth-link {
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="register-header">
        <i class="fa-solid fa-user-plus"></i>
        <h3>Đăng ký tài khoản</h3>
        <p class="mb-0">Tạo tài khoản bệnh nhân mới</p>
    </div>

    <div class="register-body">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
            Có lỗi xảy ra
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}">
            Đăng ký thành công
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">

            <div class="mb-3">
                <label class="form-label">Họ tên</label>
                <input type="text"
                       class="form-control"
                       th:field="*{fullName}"
                       placeholder="Nhập họ tên"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}"
                       placeholder="Nhập email"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password"
                       class="form-control"
                       th:field="*{password}"
                       placeholder="Nhập mật khẩu"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Số điện thoại</label>
                <input type="text"
                       class="form-control"
                       th:field="*{phone}"
                       placeholder="Nhập số điện thoại">
            </div>

            <div class="mb-3">
                <label class="form-label">Giới tính</label>
                <select class="form-select" th:field="*{gender}">
                    <option value="">-- Chọn giới tính --</option>
                    <option value="MALE">Nam</option>
                    <option value="FEMALE">Nữ</option>
                    <option value="OTHER">Khác</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Địa chỉ</label>
                <textarea class="form-control"
                          th:field="*{address}"
                          rows="3"
                          placeholder="Nhập địa chỉ"></textarea>
            </div>

            <!-- Nếu DTO RegisterRequest của bạn có role thì giữ lại.
                 Nếu DTO KHÔNG có role thì xóa input hidden này. -->
            <input type="hidden" th:field="*{role}" value="PATIENT">

            <button type="submit" class="btn btn-success w-100 btn-register">
                <i class="fa-solid fa-user-check me-1"></i>
                Đăng ký
            </button>
        </form>

        <div class="text-center mt-3">
            <span>Đã có tài khoản?</span>
            <a th:href="@{/login}" class="auth-link">Đăng nhập</a>
        </div>

    </div>
</div>

</body>
</html>
