<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dang ky tai khoan</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #198754, #0dcaf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 24px;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .register-header {
            background: #198754;
            color: white;
            padding: 26px 24px;
            text-align: center;
        }

        .register-header i {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .register-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .register-body {
            padding: 28px;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px 12px;
        }

        .btn-register {
            border-radius: 10px;
            padding: 11px;
            font-weight: 600;
        }

        .auth-link {
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .invalid-feedback {
            display: block;
            color: #dc3545;
            font-size: 0.875rem;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="register-card">

    <div class="register-header">
        <i class="fa-solid fa-user-plus"></i>
        <h3>Dang ky tai khoan</h3>
        <p class="mb-0">Tao tai khoan benh nhan moi</p>
    </div>

    <div class="register-body">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
            Co loi xay ra
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}">
            Dang ky thanh cong
        </div>

        <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" novalidate>

            <div class="mb-3">
                <label class="form-label">Ho ten</label>
                <input type="text"
                       class="form-control"
                       th:classappend="${fieldErrors != null and fieldErrors.containsKey('fullName')} ? ' is-invalid'"
                       th:field="*{fullName}"
                       placeholder="Nhap ho ten">
                <div class="invalid-feedback"
                     th:if="${fieldErrors != null and fieldErrors.containsKey('fullName')}"
                     th:text="${fieldErrors['fullName']}">
                    Ho ten khong hop le
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       class="form-control"
                       th:classappend="${fieldErrors != null and fieldErrors.containsKey('email')} ? ' is-invalid'"
                       th:field="*{email}"
                       placeholder="Nhap email">
                <div class="invalid-feedback"
                     th:if="${fieldErrors != null and fieldErrors.containsKey('email')}"
                     th:text="${fieldErrors['email']}">
                    Email khong hop le
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Mat khau</label>
                <input type="password"
                       class="form-control"
                       th:classappend="${fieldErrors != null and fieldErrors.containsKey('password')} ? ' is-invalid'"
                       th:field="*{password}"
                       placeholder="Nhap mat khau">
                <div class="invalid-feedback"
                     th:if="${fieldErrors != null and fieldErrors.containsKey('password')}"
                     th:text="${fieldErrors['password']}">
                    Mat khau khong hop le
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Xac nhan mat khau</label>
                <input type="password"
                       class="form-control"
                       th:classappend="${fieldErrors != null and fieldErrors.containsKey('confirmPassword')} ? ' is-invalid'"
                       th:field="*{confirmPassword}"
                       placeholder="Nhap lai mat khau">
                <div class="invalid-feedback"
                     th:if="${fieldErrors != null and fieldErrors.containsKey('confirmPassword')}"
                     th:text="${fieldErrors['confirmPassword']}">
                    Xac nhan mat khau khong hop le
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">So dien thoai</label>
                <input type="text"
                       class="form-control"
                       th:classappend="${fieldErrors != null and fieldErrors.containsKey('phone')} ? ' is-invalid'"
                       th:field="*{phone}"
                       placeholder="Nhap so dien thoai">
                <div class="invalid-feedback"
                     th:if="${fieldErrors != null and fieldErrors.containsKey('phone')}"
                     th:text="${fieldErrors['phone']}">
                    So dien thoai khong hop le
                </div>
            </div>

            <input type="hidden" th:field="*{role}" value="PATIENT">

            <button type="submit" class="btn btn-success w-100 btn-register">
                <i class="fa-solid fa-user-check me-1"></i>
                Dang ky
            </button>
        </form>

        <div class="text-center mt-3">
            <span>Da co tai khoan?</span>
            <a th:href="@{/auth/login}" class="auth-link">Dang nhap</a>
        </div>

    </div>
</div>

</body>
</html>
