<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Du lieu nen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('ADMIN', 'reference')}"></nav>

<div class="container py-4">
    <div class="mb-4">
        <h3>Danh muc du lieu nen</h3>
        <p class="text-muted mb-0">Admin chi xem danh muc chuyen khoa va loai xet nghiem da seed trong database.</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <strong>Chuyen khoa</strong>
                </div>

                <div class="card-body">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Ten</th>
                            <th>Mo ta</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(specialties)}">
                            <td colspan="3" class="text-center text-muted">Chua co chuyen khoa.</td>
                        </tr>
                        <tr th:each="specialty : ${specialties}">
                            <td th:text="${specialty.id}">1</td>
                            <td th:text="${specialty.name}">Noi tong quat</td>
                            <td th:text="${specialty.description}">Mo ta</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <strong>Loai xet nghiem</strong>
                </div>

                <div class="card-body">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Ten</th>
                            <th>Mo ta</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(testTypes)}">
                            <td colspan="3" class="text-center text-muted">Chua co loai xet nghiem.</td>
                        </tr>
                        <tr th:each="testType : ${testTypes}">
                            <td th:text="${testType.id}">1</td>
                            <td th:text="${testType.name}">Xet nghiem mau</td>
                            <td th:text="${testType.description}">Mo ta</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
