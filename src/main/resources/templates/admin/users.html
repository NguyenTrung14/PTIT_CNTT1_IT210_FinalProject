<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quan ly nguoi dung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('ADMIN', 'users')}"></nav>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="page-title mb-1">Quan ly nguoi dung</h3>
            <p class="text-muted mb-0">Admin xem tai khoan va cap nhat trang thai dang hoat dong hoac khoa.</p>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ho ten</th>
                        <th>Email</th>
                        <th>So dien thoai</th>
                        <th>Vai tro</th>
                        <th>Trang thai</th>
                        <th style="width: 260px;">Cap nhat</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-center text-muted py-4">Chua co nguoi dung.</td>
                    </tr>

                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td>
                            <strong th:text="${user.fullName}">Nguyen Van A</strong>
                            <span th:if="${loginUser.id == user.id}" class="badge bg-info text-dark ms-2">Ban</span>
                        </td>
                        <td th:text="${user.email}">user@gmail.com</td>
                        <td th:text="${user.phone}">0900000000</td>
                        <td>
                            <span class="badge bg-dark" th:text="${user.role}">ADMIN</span>
                        </td>
                        <td>
                            <span th:if="${user.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                            <span th:if="${user.status.name() == 'LOCKED'}" class="badge bg-secondary">LOCKED</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/users/{id}/status(id=${user.id})}"
                                  method="post"
                                  class="d-flex gap-2">
                                <select name="status"
                                        class="form-select form-select-sm"
                                        th:disabled="${user.role.name() == 'ADMIN'}">
                                    <option th:each="status : ${statuses}"
                                            th:value="${status}"
                                            th:text="${status}"
                                            th:selected="${status == user.status}">
                                        ACTIVE
                                    </option>
                                </select>

                                <button type="submit"
                                        class="btn btn-primary btn-sm"
                                        th:disabled="${user.role.name() == 'ADMIN'}">
                                    Luu
                                </button>
                            </form>
                            <small th:if="${user.role.name() == 'ADMIN'}" class="text-muted">
                                Admin khong duoc doi trang thai admin.
                            </small>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
