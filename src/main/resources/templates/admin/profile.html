<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>H? so Admin</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: main('ADMIN', 'profile')}"></nav>

<div class="container mt-4">
    <h2>H? so Admin</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/profile}" th:object="${profile}" method="post" class="card p-4">
        <input type="hidden" th:field="*{userId}">

        <div class="mb-3">
            <label class="form-label">H? tên</label>
            <input type="text" th:field="*{fullName}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">S? di?n tho?i</label>
            <input type="text" th:field="*{phone}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Gi?i tính</label>
            <select th:field="*{gender}" class="form-select">
                <option value="">-- Ch?n gi?i tính --</option>
                <option value="MALE">Nam</option>
                <option value="FEMALE">N?</option>
                <option value="OTHER">Khác</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Ð?a ch?</label>
            <input type="text" th:field="*{address}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">
            C?p nh?t h? so
        </button>
    </form>
</div>
</body>
</html>
