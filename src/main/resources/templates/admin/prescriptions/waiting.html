<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn thuốc chờ cấp phát</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Đơn thuốc chờ cấp phát</h2>

    <a th:href="@{/admin/dashboard}" class="btn btn-secondary btn-sm mb-3">Quay lại Dashboard</a>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(prescriptions)}" class="alert alert-info">
        Không có đơn thuốc nào đang chờ cấp phát.
    </div>

    <table th:if="${!#lists.isEmpty(prescriptions)}" class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>Mã đơn</th>
            <th>Bệnh nhân</th>
            <th>Bác sĩ</th>
            <th>Ngày tạo</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="prescription : ${prescriptions}">
            <td th:text="${prescription.id}"></td>
            <td th:text="${prescription.medicalRecord.patient.fullName}"></td>
            <td th:text="${prescription.medicalRecord.doctor.user.fullName}"></td>
            <td th:text="${#temporals.format(prescription.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${prescription.status}"></td>
            <td>
                <a th:href="@{/admin/prescriptions/detail/{id}(id=${prescription.id})}"
                   class="btn btn-info btn-sm">
                    Chi tiết
                </a>

                <a th:href="@{/admin/prescriptions/dispense/{id}(id=${prescription.id})}"
                   class="btn btn-success btn-sm"
                   onclick="return confirm('Xác nhận cấp phát thuốc và trừ tồn kho?')">
                    Xác nhận phát thuốc
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
