<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ðon thu?c ch? c?p phát</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main(${basePath == '/doctor' ? 'DOCTOR' : 'ADMIN'}, 'prescriptions')}"></nav>

<div class="container py-4">

    <h3>Ðon thu?c ch? c?p phát</h3>
    <p class="text-muted">Ki?m tra t?n kho và xác nh?n phát thu?c cho b?nh nhân.</p>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>B?nh nhân</th>
                    <th>Bác si kê don</th>
                    <th>Ch?n doán</th>
                    <th>S? lo?i thu?c</th>
                    <th>Ngày t?o</th>
                    <th>Tr?ng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(prescriptions)}">
                    <td colspan="8" class="text-center text-muted">
                        Không có don thu?c nào dang ch? c?p phát.
                    </td>
                </tr>

                <tr th:each="prescription : ${prescriptions}">
                    <td th:text="${prescription.id}">1</td>

                    <td th:text="${prescription.medicalRecord.patient.fullName}">B?nh nhân</td>

                    <td th:text="${prescription.medicalRecord.doctor.user.fullName}">Bác si</td>

                    <td th:text="${prescription.medicalRecord.diagnosis}">Ch?n doán</td>

                    <td th:text="${#lists.size(prescription.details)}">0</td>

                    <td th:text="${#temporals.format(prescription.createdAt, 'dd/MM/yyyy HH:mm')}">
                        01/01/2026
                    </td>

                    <td>
                        <span class="badge bg-warning text-dark"
                              th:if="${prescription.status.name() == 'WAITING_DISPENSE'}">
                            Ch? c?p phát
                        </span>

                        <span class="badge bg-success"
                              th:if="${prescription.status.name() == 'DISPENSED'}">
                            Ðã phát
                        </span>
                    </td>

                    <td>
                        <a th:href="@{${basePath + '/prescriptions/detail/' + prescription.id}}"
                           class="btn btn-primary btn-sm">
                            Chi ti?t
                        </a>

                        <a th:if="${prescription.status.name() == 'WAITING_DISPENSE'}"
                           th:href="@{${basePath + '/prescriptions/dispense/' + prescription.id}}"
                           class="btn btn-success btn-sm"
                           onclick="return confirm('Xác nh?n c?p phát thu?c và tr? t?n kho?')">
                            Xác nh?n phát
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
