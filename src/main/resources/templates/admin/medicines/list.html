<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý thuốc</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .page-title {
            font-weight: 700;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .table th {
            background: #f8f9fa;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .btn {
            border-radius: 9px;
        }

        .badge {
            padding: 7px 10px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            <i class="fa-solid fa-user-shield me-1"></i>
            Admin
        </a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/dashboard}">
                Dashboard
            </a>

            <a class="btn btn-outline-light btn-sm" th:href="@{/admin/prescriptions/waiting}">
                Cấp phát thuốc
            </a>

            <a class="btn btn-light btn-sm" th:href="@{/logout}">
                Đăng xuất
            </a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="page-title mb-1">Quản lý danh mục thuốc</h3>
            <p class="text-muted mb-0">
                Admin thực hiện thêm, xem, sửa, xóa mềm danh mục thuốc.
            </p>
        </div>

        <a th:href="@{/admin/medicines/add}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i>
            Thêm thuốc
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body">

            <form th:action="@{/admin/medicines}" method="get" class="row g-2 mb-3">
                <div class="col-md-8">
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           th:value="${keyword}"
                           placeholder="Tìm kiếm theo tên thuốc...">
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">
                        <i class="fa-solid fa-magnifying-glass me-1"></i>
                        Tìm kiếm
                    </button>
                </div>

                <div class="col-md-2">
                    <a th:href="@{/admin/medicines}" class="btn btn-outline-secondary w-100">
                        Làm mới
                    </a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên thuốc</th>
                        <th>Đơn vị</th>
                        <th>Giá</th>
                        <th>Tồn kho</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th style="width: 170px;">Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(medicines)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            Không có thuốc nào.
                        </td>
                    </tr>

                    <tr th:each="medicine : ${medicines}">
                        <td th:text="${medicine.id}">1</td>

                        <td>
                            <strong th:text="${medicine.name}">Paracetamol</strong>
                        </td>

                        <td th:text="${medicine.unit}">Viên</td>

                        <td>
                            <span th:text="${#numbers.formatDecimal(medicine.price, 0, 'COMMA', 0, 'POINT')}">
                                10000
                            </span>
                            VNĐ
                        </td>

                        <td>
                            <span th:class="${medicine.stockQuantity <= 10} ? 'badge bg-danger' : 'badge bg-success'"
                                  th:text="${medicine.stockQuantity}">
                                100
                            </span>
                        </td>

                        <td th:text="${medicine.description}">Mô tả</td>

                        <td>
                            <span class="badge bg-success"
                                  th:if="${medicine.status.name() == 'ACTIVE'}">
                                ACTIVE
                            </span>

                            <span class="badge bg-secondary"
                                  th:if="${medicine.status.name() == 'DELETED'}">
                                DELETED
                            </span>
                        </td>

                        <td>
                            <a th:href="@{/admin/medicines/edit/{id}(id=${medicine.id})}"
                               class="btn btn-warning btn-sm">
                                <i class="fa-solid fa-pen-to-square"></i>
                                Sửa
                            </a>

                            <a th:href="@{/admin/medicines/delete/{id}(id=${medicine.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Bạn chắc chắn muốn xóa thuốc này?')">
                                <i class="fa-solid fa-trash"></i>
                                Xóa
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
