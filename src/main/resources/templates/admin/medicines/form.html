<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${medicine.id == null ? 'Thêm thuốc' : 'Sửa thuốc'}">Form thuốc</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 12px;
        }

        .btn {
            border-radius: 9px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:replace="~{fragments/navbar :: main('ADMIN', 'medicines')}"></nav>

<div class="container py-4">

    <div class="mb-4">
        <h3 class="fw-bold"
            th:text="${medicine.id == null ? 'Thêm thuốc mới' : 'Cập nhật thuốc'}">
            Form thuốc
        </h3>

        <p class="text-muted mb-0">
            Nhập thông tin thuốc, tồn kho và giá bán.
        </p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card">
        <div class="card-body">

            <form th:action="${medicine.id == null} ? @{/admin/medicines/save} : @{/admin/medicines/update/{id}(id=${medicine.id})}"
                  th:object="${medicine}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Tên thuốc <span class="text-danger">*</span></label>
                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           placeholder="VD: Paracetamol"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Đơn vị <span class="text-danger">*</span></label>
                    <input type="text"
                           class="form-control"
                           th:field="*{unit}"
                           placeholder="VD: Viên, Hộp, Chai"
                           required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Giá <span class="text-danger">*</span></label>
                        <input type="number"
                               class="form-control"
                               th:field="*{price}"
                               min="0"
                               step="1000"
                               placeholder="VD: 10000"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Số lượng tồn kho <span class="text-danger">*</span></label>
                        <input type="number"
                               class="form-control"
                               th:field="*{stockQuantity}"
                               min="0"
                               placeholder="VD: 100"
                               required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control"
                              th:field="*{description}"
                              rows="4"
                              placeholder="Nhập mô tả thuốc"></textarea>
                </div>

                <div class="mb-3" th:if="${medicine.id != null}">
                    <label class="form-label">Trạng thái</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="DELETED">DELETED</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk me-1"></i>
                    Lưu thuốc
                </button>

                <a th:href="@{/admin/medicines}" class="btn btn-secondary">
                    Quay lại
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
