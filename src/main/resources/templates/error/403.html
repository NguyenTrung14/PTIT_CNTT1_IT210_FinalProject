<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Không có quyền truy cập</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .error-card {
            max-width: 520px;
            width: 100%;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            padding: 36px;
            text-align: center;
        }

        .error-icon {
            width: 90px;
            height: 90px;
            background: #dc3545;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 72px;
            font-weight: 800;
            color: #dc3545;
            margin-bottom: 0;
        }

        .btn {
            border-radius: 10px;
            padding: 10px 18px;
        }
    </style>
</head>

<body>

<div class="error-card">

    <div class="error-icon">
        <i class="fa-solid fa-ban"></i>
    </div>

    <h1>403</h1>

    <h4 class="mb-3">Bạn không có quyền truy cập</h4>

    <p class="text-muted mb-4">
        Tài khoản hiện tại không được phép truy cập trang này.
        Vui lòng quay lại đúng trang chức năng của bạn.
    </p>

    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/login}" class="btn btn-primary">
            Về đăng nhập
        </a>

        <a th:href="@{/logout}" class="btn btn-outline-secondary">
            Đăng xuất
        </a>
    </div>

</div>

</body>
</html>
