<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>L?ch khám c?a bác si</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('DOCTOR', 'appointments')}"></nav>

<div class="container py-4">

    <h3 class="mb-3">Danh sách l?ch khám</h3>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>B?nh nhân</th>
                    <th>Ngày khám</th>
                    <th>Gi?</th>
                    <th>Lý do khám</th>
                    <th>Tr?ng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="7" class="text-center text-muted">
                        Chua có l?ch khám.
                    </td>
                </tr>

                <tr th:each="appointment : ${appointments}">

                    <td th:text="${appointment.patient.fullName}"></td>

                    <td th:text="${#temporals.format(appointment.appointmentDate, 'dd/MM/yyyy')}"></td>

                    <td>
                        <span th:text="${appointment.startTime}"></span>
                        -
                        <span th:text="${appointment.endTime}"></span>
                    </td>

                    <td th:text="${appointment.reason}"></td>

                    <td>
                        <span class="badge bg-warning text-dark"
                              th:if="${appointment.status.name() == 'WAITING'}">
                            Ch? khám
                        </span>

                        <span class="badge bg-success"
                              th:if="${appointment.status.name() == 'COMPLETED'}">
                            Ðã hoàn thành
                        </span>

                        <span class="badge bg-danger"
                              th:if="${appointment.status.name() == 'CANCELLED'}">
                            Ðã h?y
                        </span>

                        <span class="badge bg-secondary"
                              th:if="${appointment.status.name() != 'WAITING'
                                      and appointment.status.name() != 'COMPLETED'
                                      and appointment.status.name() != 'CANCELLED'}"
                              th:text="${appointment.status}">
                        </span>
                    </td>

                    <td>
                        <a th:if="${appointment.status.name() == 'WAITING'}"
                           th:href="@{/doctor/examine/{id}(id=${appointment.id})}"
                           class="btn btn-primary btn-sm">
                            Khám b?nh
                        </a>

                        <span th:if="${appointment.status.name() != 'WAITING'}"
                              class="text-muted">
                            Không kh? d?ng
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

</body>
</html>
