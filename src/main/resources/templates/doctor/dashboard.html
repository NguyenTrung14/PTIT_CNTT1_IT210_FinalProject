<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard bác sĩ</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('DOCTOR', 'dashboard')}"></nav>

<div class="container py-4">

    <h3>
        Xin chào,
        <span th:text="${loginUser.fullName}"></span>
    </h3>

    <p class="text-muted">
        Chuyên khoa:
        <span th:text="${doctor.specialty.name}"></span>
    </p>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Tổng lịch khám</h6>
                    <h3 th:text="${#lists.size(appointments)}">0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <strong>Lịch khám gần nhất</strong>
        </div>

        <div class="card-body">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                <tr>
                    <th>Bệnh nhân</th>
                    <th>Ngày</th>
                    <th>Giờ</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="5" class="text-center text-muted">
                        Chưa có lịch khám.
                    </td>
                </tr>

                <tr th:each="appointment : ${appointments}">
                    <td th:text="${appointment.patient.fullName}"></td>

                    <td th:text="${#temporals.format(appointment.appointmentDate, 'dd/MM/yyyy')}"></td>

                    <td>
                        <span th:text="${appointment.startTime}"></span>
                        -
                        <span th:text="${appointment.endTime}"></span>
                    </td>

                    <td th:text="${appointment.status}"></td>

                    <td>
                        <a th:if="${appointment.status.name() == 'WAITING'}"
                           th:href="@{/doctor/examine/{id}(id=${appointment.id})}"
                           class="btn btn-primary btn-sm">
                            Khám
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/doctor/appointments}" class="btn btn-success">
                Xem tất cả lịch khám
            </a>
        </div>
    </div>

</div>

</body>
</html>
