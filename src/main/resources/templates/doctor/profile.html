<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ bác sĩ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/doctor/dashboard}">Cổng bác sĩ</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/doctor/dashboard}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/doctor/appointments}">Lịch khám</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/doctor/prescriptions/waiting}">Đơn thuốc</a>
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <h3 class="mb-3">Hồ sơ bác sĩ</h3>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <strong>Thông tin chuyên môn</strong>
                </div>

                <div class="card-body">
                    <p>
                        <strong>Chuyên khoa:</strong>
                        <span th:text="${doctor.specialty.name}">Chuyên khoa</span>
                    </p>

                    <p>
                        <strong>Số năm kinh nghiệm:</strong>
                        <span th:text="${doctor.experienceYears}">0</span>
                    </p>

                    <p>
                        <strong>Trạng thái:</strong>
                        <span th:text="${doctor.status}">ACTIVE</span>
                    </p>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <strong>Thông tin cá nhân</strong>
                </div>

                <div class="card-body">
                    <form th:action="@{/doctor/profile}" th:object="${profile}" method="post">

                        <input type="hidden" th:field="*{userId}">

                        <div class="mb-3">
                            <label class="form-label">Họ tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" th:field="*{phone}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Giới tính</label>
                            <select class="form-select" th:field="*{gender}">
                                <option value="">-- Chọn giới tính --</option>
                                <option value="MALE">Nam</option>
                                <option value="FEMALE">Nữ</option>
                                <option value="OTHER">Khác</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <textarea class="form-control" th:field="*{address}" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-success">
                            Cập nhật hồ sơ
                        </button>

                        <a th:href="@{/doctor/dashboard}" class="btn btn-secondary">
                            Quay lại
                        </a>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
