<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Khám bệnh</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('DOCTOR', 'appointments')}"></nav>

<div class="container py-4">

    <h3 class="mb-4">Khám bệnh và kê đơn</h3>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-white">
            <strong>Thông tin lịch khám</strong>
        </div>

        <div class="card-body">
            <p>
                <strong>Bệnh nhân:</strong>
                <span th:text="${appointment.patient.fullName}"></span>
            </p>

            <p>
                <strong>Ngày khám:</strong>
                <span th:text="${#temporals.format(appointment.appointmentDate, 'dd/MM/yyyy')}"></span>
            </p>

            <p>
                <strong>Giờ khám:</strong>
                <span th:text="${appointment.startTime}"></span>
                -
                <span th:text="${appointment.endTime}"></span>
            </p>

            <p>
                <strong>Lý do khám:</strong>
                <span th:text="${appointment.reason}"></span>
            </p>
        </div>
    </div>

    <form th:action="@{/doctor/examine}" th:object="${medicalRecord}" method="post">

        <input type="hidden" th:field="*{appointmentId}">

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <strong>Kết quả khám</strong>
            </div>

            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Triệu chứng</label>
                    <textarea class="form-control"
                              th:field="*{symptoms}"
                              rows="3"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Chẩn đoán</label>
                    <textarea class="form-control"
                              th:field="*{diagnosis}"
                              rows="3"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phác đồ điều trị</label>
                    <textarea class="form-control"
                              th:field="*{treatmentPlan}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ghi chú</label>
                    <textarea class="form-control"
                              th:field="*{note}"
                              rows="2"></textarea>
                </div>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <strong>Kê đơn thuốc</strong>
            </div>

            <div class="card-body">

                <p class="text-muted">
                    Không bắt buộc kê thuốc. Bấm Thêm thuốc nếu bệnh nhân cần dùng thuốc điều trị.
                </p>

                <div id="prescriptionRows">
                    <div class="row g-2 mb-3 prescription-row"
                         th:each="detail, iterStat : *{prescriptionDetails}">
                        <div class="col-md-3">
                            <label class="form-label medicine-label"
                                   th:text="${'Thuoc ' + (iterStat.index + 1)}">Thuoc</label>
                            <select class="form-select medicine-select"
                                    th:name="${'prescriptionDetails[' + iterStat.index + '].medicineId'}">
                                <option value="">-- Chon thuoc --</option>
                                <option th:each="medicine : ${medicines}"
                                        th:value="${medicine.id}"
                                        th:selected="${medicine.id == detail.medicineId}"
                                        th:text="${medicine.name + ' - ton: ' + medicine.stockQuantity}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label class="form-label">So luong</label>
                            <input type="number"
                                   class="form-control quantity-input"
                                   min="1"
                                   th:name="${'prescriptionDetails[' + iterStat.index + '].quantity'}"
                                   th:value="${detail.quantity}">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Lieu dung</label>
                            <input type="text"
                                   class="form-control dosage-input"
                                   th:name="${'prescriptionDetails[' + iterStat.index + '].dosage'}"
                                   th:value="${detail.dosage}"
                                   placeholder="VD: 2 vien/ngay">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Huong dan</label>
                            <input type="text"
                                   class="form-control instruction-input"
                                   th:name="${'prescriptionDetails[' + iterStat.index + '].usageInstruction'}"
                                   th:value="${detail.usageInstruction}"
                                   placeholder="VD: Uong sau an">
                        </div>

                        <div class="col-md-1 d-flex align-items-end">
                            <button type="button" class="btn btn-outline-danger w-100 remove-medicine-btn">
                                Xoa
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-outline-primary btn-sm" id="addMedicineBtn">
                    Thêm thuốc
                </button>

            </div>
        </div>

        <button type="submit" class="btn btn-success">
            Lưu kết quả khám
        </button>

        <a th:href="@{/doctor/appointments}" class="btn btn-secondary">
            Hủy
        </a>
    </form>

</div>

<template id="medicineRowTemplate">
    <div class="row g-2 mb-3 prescription-row">
        <div class="col-md-3">
            <label class="form-label medicine-label">Thuốc</label>
            <select class="form-select medicine-select">
                <option value="">-- Chọn thuốc --</option>
                <option th:each="medicine : ${medicines}"
                        th:value="${medicine.id}"
                        th:text="${medicine.name + ' - tồn: ' + medicine.stockQuantity}">
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">Số lượng</label>
            <input type="number" class="form-control quantity-input" min="1" value="1">
        </div>

        <div class="col-md-3">
            <label class="form-label">Liều dùng</label>
            <input type="text" class="form-control dosage-input" placeholder="VD: 2 viên/ngày">
        </div>

        <div class="col-md-3">
            <label class="form-label">Hướng dẫn</label>
            <input type="text" class="form-control instruction-input" placeholder="VD: Uống sau ăn">
        </div>

        <div class="col-md-1 d-flex align-items-end">
            <button type="button" class="btn btn-outline-danger w-100 remove-medicine-btn">
                Xóa
            </button>
        </div>
    </div>
</template>

<script>
    const prescriptionRows = document.getElementById('prescriptionRows');
    const addMedicineBtn = document.getElementById('addMedicineBtn');
    const medicineRowTemplate = document.getElementById('medicineRowTemplate');
    const examinationForm = prescriptionRows.closest('form');

    function refreshPrescriptionRowNames() {
        prescriptionRows.querySelectorAll('.prescription-row').forEach((row, index) => {
            row.querySelector('.medicine-label').textContent = `Thuốc ${index + 1}`;
            row.querySelector('.medicine-select').name = `prescriptionDetails[${index}].medicineId`;
            row.querySelector('.quantity-input').name = `prescriptionDetails[${index}].quantity`;
            row.querySelector('.dosage-input').name = `prescriptionDetails[${index}].dosage`;
            row.querySelector('.instruction-input').name = `prescriptionDetails[${index}].usageInstruction`;
        });
    }

    addMedicineBtn.addEventListener('click', () => {
        const row = medicineRowTemplate.content.cloneNode(true);
        prescriptionRows.appendChild(row);
        refreshPrescriptionRowNames();
    });

    prescriptionRows.addEventListener('click', event => {
        if (!event.target.classList.contains('remove-medicine-btn')) {
            return;
        }

        event.target.closest('.prescription-row').remove();
        refreshPrescriptionRowNames();
    });

    examinationForm.addEventListener('submit', event => {
        const selectedMedicineIds = new Set();

        for (const select of prescriptionRows.querySelectorAll('.medicine-select')) {
            if (!select.value) {
                continue;
            }

            if (selectedMedicineIds.has(select.value)) {
                event.preventDefault();
                alert('Thuoc bi trung da ke trong don');
                return;
            }

            selectedMedicineIds.add(select.value);
        }
    });

    refreshPrescriptionRowNames();
</script>

</body>
</html>
