<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Khám bệnh</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('DOCTOR', 'appointments')}"></nav>

<div class="container py-4">

    <h3 class="mb-4">Khám bệnh và kê đơn</h3>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-white">
            <strong>Thông tin lịch khám</strong>
        </div>

        <div class="card-body">
            <p>
                <strong>Bệnh nhân:</strong>
                <span th:text="${appointment.patient.fullName}"></span>
            </p>

            <p>
                <strong>Ngày khám:</strong>
                <span th:text="${#temporals.format(appointment.appointmentDate, 'dd/MM/yyyy')}"></span>
            </p>

            <p>
                <strong>Giờ khám:</strong>
                <span th:text="${appointment.startTime}"></span>
                -
                <span th:text="${appointment.endTime}"></span>
            </p>

            <p>
                <strong>Lý do khám:</strong>
                <span th:text="${appointment.reason}"></span>
            </p>
        </div>
    </div>

    <form th:action="@{/doctor/examine}" th:object="${medicalRecord}" method="post">

        <input type="hidden" th:field="*{appointmentId}">

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <strong>Kết quả khám</strong>
            </div>

            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Triệu chứng</label>
                    <textarea class="form-control"
                              th:field="*{symptoms}"
                              rows="3"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Chẩn đoán</label>
                    <textarea class="form-control"
                              th:field="*{diagnosis}"
                              rows="3"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phác đồ điều trị</label>
                    <textarea class="form-control"
                              th:field="*{treatmentPlan}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ghi chú</label>
                    <textarea class="form-control"
                              th:field="*{note}"
                              rows="2"></textarea>
                </div>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <strong>Kê đơn thuốc</strong>
            </div>

            <div class="card-body">

                <p class="text-muted">
                    Nhập tối thiểu 1 dòng thuốc. Dòng nào không chọn thuốc sẽ được bỏ qua.
                </p>

                <div class="row g-2 mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Thuốc 1</label>
                        <select class="form-select" name="prescriptionDetails[0].medicineId">
                            <option value="">-- Chọn thuốc --</option>
                            <option th:each="medicine : ${medicines}"
                                    th:value="${medicine.id}"
                                    th:text="${medicine.name + ' - tồn: ' + medicine.stockQuantity}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Số lượng</label>
                        <input type="number"
                               class="form-control"
                               name="prescriptionDetails[0].quantity"
                               min="1">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Liều dùng</label>
                        <input type="text"
                               class="form-control"
                               name="prescriptionDetails[0].dosage"
                               placeholder="VD: 2 viên/ngày">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Hướng dẫn</label>
                        <input type="text"
                               class="form-control"
                               name="prescriptionDetails[0].usageInstruction"
                               placeholder="VD: Uống sau ăn">
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Thuốc 2</label>
                        <select class="form-select" name="prescriptionDetails[1].medicineId">
                            <option value="">-- Chọn thuốc --</option>
                            <option th:each="medicine : ${medicines}"
                                    th:value="${medicine.id}"
                                    th:text="${medicine.name + ' - tồn: ' + medicine.stockQuantity}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Số lượng</label>
                        <input type="number"
                               class="form-control"
                               name="prescriptionDetails[1].quantity"
                               min="1">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Liều dùng</label>
                        <input type="text"
                               class="form-control"
                               name="prescriptionDetails[1].dosage">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Hướng dẫn</label>
                        <input type="text"
                               class="form-control"
                               name="prescriptionDetails[1].usageInstruction">
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Thuốc 3</label>
                        <select class="form-select" name="prescriptionDetails[2].medicineId">
                            <option value="">-- Chọn thuốc --</option>
                            <option th:each="medicine : ${medicines}"
                                    th:value="${medicine.id}"
                                    th:text="${medicine.name + ' - tồn: ' + medicine.stockQuantity}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Số lượng</label>
                        <input type="number"
                               class="form-control"
                               name="prescriptionDetails[2].quantity"
                               min="1">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Liều dùng</label>
                        <input type="text"
                               class="form-control"
                               name="prescriptionDetails[2].dosage">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Hướng dẫn</label>
                        <input type="text"
                               class="form-control"
                               name="prescriptionDetails[2].usageInstruction">
                    </div>
                </div>

            </div>
        </div>

        <button type="submit" class="btn btn-success">
            Lưu kết quả khám
        </button>

        <a th:href="@{/doctor/appointments}" class="btn btn-secondary">
            Hủy
        </a>
    </form>

</div>

</body>
</html>
