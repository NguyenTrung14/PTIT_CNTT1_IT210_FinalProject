<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Khám b?nh</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('DOCTOR', 'appointments')}"></nav>

<div class="container py-4">

    <h3 class="mb-4">Khám b?nh và kê don</h3>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-white">
            <strong>Thông tin l?ch khám</strong>
        </div>

        <div class="card-body">
            <p>
                <strong>B?nh nhân:</strong>
                <span th:text="${appointment.patient.fullName}"></span>
            </p>

            <p>
                <strong>Ngày khám:</strong>
                <span th:text="${#temporals.format(appointment.appointmentDate, 'dd/MM/yyyy')}"></span>
            </p>

            <p>
                <strong>Gi? khám:</strong>
                <span th:text="${appointment.startTime}"></span>
                -
                <span th:text="${appointment.endTime}"></span>
            </p>

            <p>
                <strong>Lý do khám:</strong>
                <span th:text="${appointment.reason}"></span>
            </p>
        </div>
    </div>

    <form th:action="@{/doctor/examine}" th:object="${medicalRecord}" method="post">

        <input type="hidden" th:field="*{appointmentId}">

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <strong>K?t qu? khám</strong>
            </div>

            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Tri?u ch?ng</label>
                    <textarea class="form-control"
                              th:field="*{symptoms}"
                              rows="3"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ch?n doán</label>
                    <textarea class="form-control"
                              th:field="*{diagnosis}"
                              rows="3"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phác d? di?u tr?</label>
                    <textarea class="form-control"
                              th:field="*{treatmentPlan}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ghi chú</label>
                    <textarea class="form-control"
                              th:field="*{note}"
                              rows="2"></textarea>
                </div>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white">
                <strong>Kê don thu?c</strong>
            </div>

            <div class="card-body">

                <p class="text-muted">
                    Không b?t bu?c kê thu?c. B?m Thêm thu?c n?u b?nh nhân c?n dùng thu?c di?u tr?.
                </p>

                <div id="prescriptionRows"></div>

                <button type="button" class="btn btn-outline-primary btn-sm" id="addMedicineBtn">
                    Thêm thu?c
                </button>

            </div>
        </div>

        <button type="submit" class="btn btn-success">
            Luu k?t qu? khám
        </button>

        <a th:href="@{/doctor/appointments}" class="btn btn-secondary">
            H?y
        </a>
    </form>

</div>

<template id="medicineRowTemplate">
    <div class="row g-2 mb-3 prescription-row">
        <div class="col-md-3">
            <label class="form-label medicine-label">Thu?c</label>
            <select class="form-select medicine-select">
                <option value="">-- Ch?n thu?c --</option>
                <option th:each="medicine : ${medicines}"
                        th:value="${medicine.id}"
                        th:text="${medicine.name + ' - t?n: ' + medicine.stockQuantity}">
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <label class="form-label">S? lu?ng</label>
            <input type="number" class="form-control quantity-input" min="1" value="1">
        </div>

        <div class="col-md-3">
            <label class="form-label">Li?u dùng</label>
            <input type="text" class="form-control dosage-input" placeholder="VD: 2 viên/ngày">
        </div>

        <div class="col-md-3">
            <label class="form-label">Hu?ng d?n</label>
            <input type="text" class="form-control instruction-input" placeholder="VD: U?ng sau an">
        </div>

        <div class="col-md-1 d-flex align-items-end">
            <button type="button" class="btn btn-outline-danger w-100 remove-medicine-btn">
                Xóa
            </button>
        </div>
    </div>
</template>

<script>
    const prescriptionRows = document.getElementById('prescriptionRows');
    const addMedicineBtn = document.getElementById('addMedicineBtn');
    const medicineRowTemplate = document.getElementById('medicineRowTemplate');

    function refreshPrescriptionRowNames() {
        prescriptionRows.querySelectorAll('.prescription-row').forEach((row, index) => {
            row.querySelector('.medicine-label').textContent = `Thu?c ${index + 1}`;
            row.querySelector('.medicine-select').name = `prescriptionDetails[${index}].medicineId`;
            row.querySelector('.quantity-input').name = `prescriptionDetails[${index}].quantity`;
            row.querySelector('.dosage-input').name = `prescriptionDetails[${index}].dosage`;
            row.querySelector('.instruction-input').name = `prescriptionDetails[${index}].usageInstruction`;
        });
    }

    addMedicineBtn.addEventListener('click', () => {
        const row = medicineRowTemplate.content.cloneNode(true);
        prescriptionRows.appendChild(row);
        refreshPrescriptionRowNames();
    });

    prescriptionRows.addEventListener('click', event => {
        if (!event.target.classList.contains('remove-medicine-btn')) {
            return;
        }

        event.target.closest('.prescription-row').remove();
        refreshPrescriptionRowNames();
    });
</script>

</body>
</html>
