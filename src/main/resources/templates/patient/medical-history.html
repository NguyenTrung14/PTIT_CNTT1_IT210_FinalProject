<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử bệnh án</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('PATIENT', 'history')}"></nav>

<div class="container py-4">

    <h3 class="mb-4">Lịch sử hồ sơ y tế</h3>

    <div th:if="${#lists.isEmpty(records)}" class="alert alert-info">
        Bạn chưa có hồ sơ bệnh án nào.
    </div>

    <div th:each="record : ${records}" class="card mb-4 shadow-sm">
        <div class="card-header bg-white">
            <div class="d-flex justify-content-between">
                <strong>
                    Lần khám #
                    <span th:text="${record.id}"></span>
                </strong>

                <span class="text-muted"
                      th:text="${#temporals.format(record.createdAt, 'dd/MM/yyyy HH:mm')}">
                </span>
            </div>
        </div>

        <div class="card-body">
            <p>
                <strong>Bác sĩ:</strong>
                <span th:text="${record.doctor.user.fullName}"></span>
            </p>

            <p>
                <strong>Ngày khám:</strong>
                <span th:text="${#temporals.format(record.appointment.appointmentDate, 'dd/MM/yyyy')}"></span>
                -
                <span th:text="${record.appointment.startTime}"></span>
                đến
                <span th:text="${record.appointment.endTime}"></span>
            </p>

            <p>
                <strong>Triệu chứng:</strong>
                <span th:text="${record.symptoms}"></span>
            </p>

            <p>
                <strong>Chẩn đoán:</strong>
                <span th:text="${record.diagnosis}"></span>
            </p>

            <p th:if="${record.treatmentPlan != null and !record.treatmentPlan.isBlank()}">
                <strong>Phác đồ điều trị:</strong>
                <span th:text="${record.treatmentPlan}"></span>
            </p>

            <p th:if="${record.note != null and !record.note.isBlank()}">
                <strong>Ghi chú:</strong>
                <span th:text="${record.note}"></span>
            </p>

            <h6 class="mt-4">Danh sách thuốc đã kê</h6>

            <table class="table table-bordered table-sm align-middle">
                <thead class="table-light">
                <tr>
                    <th>Tên thuốc</th>
                    <th>Số lượng</th>
                    <th>Liều dùng</th>
                    <th>Hướng dẫn sử dụng</th>
                    <th>Trạng thái đơn</th>
                </tr>
                </thead>

                <tbody th:with="details=${record.prescription == null ? null : record.prescription.details}">
                <tr th:if="${record.prescription == null or details == null or #lists.isEmpty(details)}">
                    <td colspan="5" class="text-center text-muted">
                        Không có thuốc được kê.
                    </td>
                </tr>

                <tr th:if="${record.prescription != null}"
                    th:each="detail, iterStat : ${details}">
                    <td th:text="${detail.medicine.name}"></td>
                    <td th:text="${detail.quantity}"></td>
                    <td th:text="${detail.dosage}"></td>
                    <td th:text="${detail.usageInstruction}"></td>
                    <td th:if="${iterStat.first}" th:rowspan="${#lists.size(details)}">
                        <span class="badge bg-warning text-dark"
                              th:if="${record.prescription.status.name() == 'WAITING_DISPENSE'}">
                                Chờ cấp phát
                            </span>

                        <span class="badge bg-success"
                              th:if="${record.prescription.status.name() == 'DISPENSED'}">
                                Đã phát thuốc
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
