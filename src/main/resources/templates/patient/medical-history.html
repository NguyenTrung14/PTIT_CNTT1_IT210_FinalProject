<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>L?ch s? b?nh án</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('PATIENT', 'history')}"></nav>

<div class="container py-4">

    <h3 class="mb-4">L?ch s? h? so y t?</h3>

    <div th:if="${#lists.isEmpty(records)}" class="alert alert-info">
        B?n chua có h? so b?nh án nào.
    </div>

    <div th:each="record : ${records}" class="card mb-4 shadow-sm">
        <div class="card-header bg-white">
            <div class="d-flex justify-content-between">
                <strong>
                    L?n khám #
                    <span th:text="${record.id}"></span>
                </strong>

                <span class="text-muted"
                      th:text="${#temporals.format(record.createdAt, 'dd/MM/yyyy HH:mm')}">
                </span>
            </div>
        </div>

        <div class="card-body">
            <p>
                <strong>Bác si:</strong>
                <span th:text="${record.doctor.user.fullName}"></span>
            </p>

            <p>
                <strong>Ngày khám:</strong>
                <span th:text="${#temporals.format(record.appointment.appointmentDate, 'dd/MM/yyyy')}"></span>
                -
                <span th:text="${record.appointment.startTime}"></span>
                d?n
                <span th:text="${record.appointment.endTime}"></span>
            </p>

            <p>
                <strong>Tri?u ch?ng:</strong>
                <span th:text="${record.symptoms}"></span>
            </p>

            <p>
                <strong>Ch?n doán:</strong>
                <span th:text="${record.diagnosis}"></span>
            </p>

            <p th:if="${record.treatmentPlan != null and !record.treatmentPlan.isBlank()}">
                <strong>Phác d? di?u tr?:</strong>
                <span th:text="${record.treatmentPlan}"></span>
            </p>

            <p th:if="${record.note != null and !record.note.isBlank()}">
                <strong>Ghi chú:</strong>
                <span th:text="${record.note}"></span>
            </p>

            <h6 class="mt-4">Danh sách thu?c dã kê</h6>

            <table class="table table-bordered table-sm align-middle">
                <thead class="table-light">
                <tr>
                    <th>Tên thu?c</th>
                    <th>S? lu?ng</th>
                    <th>Li?u dùng</th>
                    <th>Hu?ng d?n s? d?ng</th>
                    <th>Tr?ng thái don</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${record.prescription == null or #lists.isEmpty(record.prescription.details)}">
                    <td colspan="5" class="text-center text-muted">
                        Không có thu?c du?c kê.
                    </td>
                </tr>

                <th:block th:if="${record.prescription != null}">
                    <tr th:each="detail : ${record.prescription.details}">
                        <td th:text="${detail.medicine.name}"></td>
                        <td th:text="${detail.quantity}"></td>
                        <td th:text="${detail.dosage}"></td>
                        <td th:text="${detail.usageInstruction}"></td>
                        <td>
                            <span class="badge bg-warning text-dark"
                                  th:if="${record.prescription.status.name() == 'WAITING_DISPENSE'}">
                                Ch? c?p phát
                            </span>

                            <span class="badge bg-success"
                                  th:if="${record.prescription.status.name() == 'DISPENSED'}">
                                Ðã phát thu?c
                            </span>
                        </td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
