<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử bệnh án</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Lịch sử khám bệnh</h2>

    <a th:href="@{/patient/dashboard}" class="btn btn-secondary btn-sm mb-3">Quay lại Dashboard</a>

    <div th:if="${#lists.isEmpty(records)}" class="alert alert-info">
        Bạn chưa có hồ sơ bệnh án nào.
    </div>

    <div th:each="record : ${records}" class="card mb-4">
        <div class="card-header">
            <b>Mã bệnh án:</b> <span th:text="${record.id}"></span>
            |
            <b>Ngày tạo:</b>
            <span th:text="${#temporals.format(record.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
        </div>

        <div class="card-body">
            <p>
                <b>Bác sĩ:</b>
                <span th:text="${record.doctor.user.fullName}"></span>
            </p>

            <p>
                <b>Chuyên khoa:</b>
                <span th:text="${record.doctor.specialty.name}"></span>
            </p>

            <p>
                <b>Ngày khám:</b>
                <span th:text="${#temporals.format(record.appointment.appointmentDate, 'dd/MM/yyyy')}"></span>
                từ
                <span th:text="${record.appointment.startTime}"></span>
                đến
                <span th:text="${record.appointment.endTime}"></span>
            </p>

            <p>
                <b>Triệu chứng:</b>
                <span th:text="${record.symptoms}"></span>
            </p>

            <p>
                <b>Chẩn đoán:</b>
                <span th:text="${record.diagnosis}"></span>
            </p>

            <p>
                <b>Phác đồ điều trị:</b>
                <span th:text="${record.treatmentPlan}"></span>
            </p>

            <p>
                <b>Ghi chú:</b>
                <span th:text="${record.note}"></span>
            </p>

            <hr>

            <h5>Đơn thuốc</h5>

            <div th:if="${record.prescription == null}" class="text-muted">
                Chưa có đơn thuốc.
            </div>

            <div th:if="${record.prescription != null}">
                <p>
                    <b>Trạng thái đơn thuốc:</b>
                    <span th:text="${record.prescription.status}"></span>
                </p>

                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>Tên thuốc</th>
                        <th>Đơn vị</th>
                        <th>Số lượng</th>
                        <th>Liều dùng</th>
                        <th>Hướng dẫn sử dụng</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="detail : ${record.prescription.details}">
                        <td th:text="${detail.medicine.name}"></td>
                        <td th:text="${detail.medicine.unit}"></td>
                        <td th:text="${detail.quantity}"></td>
                        <td th:text="${detail.dosage}"></td>
                        <td th:text="${detail.usageInstruction}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
