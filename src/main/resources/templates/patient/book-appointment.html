<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lịch khám</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/patient/dashboard}">Cổng bệnh nhân</a>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/patient/dashboard}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/patient/appointments}">Lịch của tôi</a>
            <a class="btn btn-light btn-sm" th:href="@{/logout}">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="mb-4">
        <h3>Đặt lịch khám</h3>
        <p class="text-muted mb-0">Chọn chuyên khoa, bác sĩ, ngày và khung giờ khám.</p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form th:action="@{/patient/appointments/book}" th:object="${appointment}" method="post">

                <input type="hidden" th:field="*{patientId}">

                <div class="mb-3">
                    <label class="form-label">Chuyên khoa</label>
                    <select class="form-select" name="specialtyId" required>
                        <option value="">-- Chọn chuyên khoa --</option>
                        <option th:each="specialty : ${specialties}"
                                th:value="${specialty.id}"
                                th:text="${specialty.name}">
                        </option>
                    </select>
                    <small class="text-muted">
                        Mục này để hiển thị theo SRS. Danh sách bác sĩ bên dưới vẫn lấy toàn bộ bác sĩ đang hoạt động.
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Bác sĩ</label>
                    <select class="form-select" th:field="*{doctorId}" required>
                        <option value="">-- Chọn bác sĩ --</option>
                        <option th:each="doctor : ${doctors}"
                                th:value="${doctor.id}"
                                th:text="${doctor.user.fullName + ' - ' + doctor.specialty.name}">
                        </option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ngày khám</label>
                        <input type="date" class="form-control" th:field="*{appointmentDate}" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Giờ bắt đầu</label>
                        <input type="time" class="form-control" th:field="*{startTime}" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Giờ kết thúc</label>
                        <input type="time" class="form-control" th:field="*{endTime}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lý do khám</label>
                    <textarea class="form-control"
                              th:field="*{reason}"
                              rows="4"
                              placeholder="VD: Đau đầu, sốt, ho..."
                              required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Xác nhận đặt lịch
                </button>

                <a th:href="@{/patient/dashboard}" class="btn btn-secondary">
                    Hủy
                </a>
            </form>

        </div>
    </div>
</div>

</body>
</html>
