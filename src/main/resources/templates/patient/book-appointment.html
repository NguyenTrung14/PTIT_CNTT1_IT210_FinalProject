<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ð?t l?ch khám</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('PATIENT', 'book')}"></nav>

<div class="container py-4">

    <div class="mb-4">
        <h3>Ð?t l?ch khám</h3>
        <p class="text-muted mb-0">Ch?n chuyên khoa, bác si, ngày và khung gi? khám.</p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form th:action="@{/patient/appointments/book}" th:object="${appointment}" method="post">

                <input type="hidden" th:field="*{patientId}">

                <div class="mb-3">
                    <label class="form-label">Chuyên khoa</label>
                    <select class="form-select" id="specialtySelect" th:field="*{specialtyId}" required>
                        <option value="">-- Ch?n chuyên khoa --</option>
                        <option th:each="specialty : ${specialties}"
                                th:value="${specialty.id}"
                                th:text="${specialty.name}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Bác si</label>
                    <select class="form-select"
                            id="doctorSelect"
                            th:field="*{doctorId}"
                            th:attr="data-selected-doctor-id=*{doctorId}"
                            required
                            disabled>
                        <option value="">-- Ch?n chuyên khoa tru?c --</option>
                        <option th:each="doctor : ${doctors}"
                                th:value="${doctor.id}"
                                th:attr="data-specialty-id=${doctor.specialty.id}"
                                th:text="${doctor.user.fullName + ' - ' + doctor.specialty.name}">
                        </option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ngày khám</label>
                        <input type="date" class="form-control" th:field="*{appointmentDate}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Gi? b?t d?u</label>
                        <input type="time" class="form-control" th:field="*{startTime}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lý do khám</label>
                    <textarea class="form-control"
                              th:field="*{reason}"
                              rows="4"
                              placeholder="VD: Ðau d?u, s?t, ho..."
                              required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Xác nh?n d?t l?ch
                </button>

                <a th:href="@{/patient/dashboard}" class="btn btn-secondary">
                    H?y
                </a>
            </form>

        </div>
    </div>
</div>

<script>
    const specialtySelect = document.getElementById('specialtySelect');
    const doctorSelect = document.getElementById('doctorSelect');
    const doctorOptions = Array.from(doctorSelect.querySelectorAll('option[data-specialty-id]'));
    const placeholderOption = doctorSelect.querySelector('option[value=""]');
    const selectedDoctorId = doctorSelect.dataset.selectedDoctorId || '';

    function filterDoctorsBySpecialty(keepSelectedDoctor = false) {
        const specialtyId = specialtySelect.value;
        doctorSelect.disabled = specialtyId === '';
        placeholderOption.textContent = specialtyId === ''
            ? '-- Ch?n chuyên khoa tru?c --'
            : '-- Ch?n bác si --';

        doctorOptions.forEach(option => {
            option.hidden = option.dataset.specialtyId !== specialtyId;
        });

        if (keepSelectedDoctor && selectedDoctorId !== '') {
            const selectedOption = doctorOptions.find(option => option.value === selectedDoctorId);
            if (selectedOption && selectedOption.dataset.specialtyId === specialtyId) {
                doctorSelect.value = selectedDoctorId;
                return;
            }
        }

        doctorSelect.value = '';
    }

    specialtySelect.addEventListener('change', () => filterDoctorsBySpecialty(false));
    filterDoctorsBySpecialty(true);
</script>

</body>
</html>
