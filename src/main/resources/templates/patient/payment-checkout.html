<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toan lich kham</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main('PATIENT', 'appointments')}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white">
                    <strong>Thanh toan mo phong</strong>
                </div>

                <div class="card-body">
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <dl class="row mb-4">
                        <dt class="col-sm-4">Ma lich kham</dt>
                        <dd class="col-sm-8" th:text="${payment.appointment.id}">1</dd>

                        <dt class="col-sm-4">Benh nhan</dt>
                        <dd class="col-sm-8" th:text="${payment.patient.fullName}">Benh nhan</dd>

                        <dt class="col-sm-4">Bac si</dt>
                        <dd class="col-sm-8" th:text="${payment.appointment.doctor.user.fullName}">Bac si</dd>

                        <dt class="col-sm-4">Ngay gio</dt>
                        <dd class="col-sm-8">
                            <span th:text="${#temporals.format(payment.appointment.appointmentDate, 'dd/MM/yyyy')}">01/01/2026</span>
                            <span th:text="${payment.appointment.startTime}">08:00</span>
                            -
                            <span th:text="${payment.appointment.endTime}">08:30</span>
                        </dd>

                        <dt class="col-sm-4">So tien</dt>
                        <dd class="col-sm-8">
                            <strong th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT')} + ' VND'">100,000 VND</strong>
                        </dd>

                        <dt class="col-sm-4">Trang thai</dt>
                        <dd class="col-sm-8">
                            <span class="badge bg-warning text-dark" th:if="${payment.status.name() == 'PENDING'}">Cho thanh toan</span>
                            <span class="badge bg-success" th:if="${payment.status.name() == 'PAID'}">Da thanh toan</span>
                            <span class="badge bg-secondary" th:if="${payment.status.name() != 'PENDING' and payment.status.name() != 'PAID'}" th:text="${payment.status}"></span>
                        </dd>
                    </dl>

                    <form th:if="${payment.status.name() == 'PENDING'}"
                          th:action="@{/patient/payments/confirm/{id}(id=${payment.appointment.id})}"
                          method="post">
                        <button type="submit" class="btn btn-success">
                            Xac nhan thanh toan
                        </button>
                        <a th:href="@{/patient/appointments}" class="btn btn-secondary">De sau</a>
                    </form>

                    <a th:if="${payment.status.name() != 'PENDING'}"
                       th:href="@{/patient/appointments}"
                       class="btn btn-primary">
                        Ve lich cua toi
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
